        <feColorMatrix
          type="matrix"
          values="0.2126 0.7152 0.0722 0 0
                  0.2126 0.7152 0.0722 0 0
                  0.2126 0.7152 0.0722 0 0
                  0      0      0      1 0"
        />

          <feFuncR type="table" tableValues="0.02 0.06 0.96" />
          <feFuncG type="table" tableValues="0.08 0.18 0.98" />
          <feFuncB type="table" tableValues="0.45 0.88 1.0" />
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
